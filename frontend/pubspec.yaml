name: vocational_skills_app
description: "Mobile-Based Vocational Skills Acquisition System - EDSAC FPI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  google_fonts: ^8.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.1
  go_router: ^17.3.0
  fl_chart: ^1.2.0
  form_field_validator: ^1.1.0
  intl: ^0.20.3
  jwt_decoder: ^2.0.1
  font_awesome_flutter: ^11.0.0
  image_picker: ^1.1.2
  file_picker: ^10.3.3

  # ── Video Player (online streaming) ──────────────────────
  video_player: ^2.9.2
  chewie: 1.13.1                      # pinned: 1.14.1 conflicts with file_picker 11.x

  # ── File Download & Open ─────────────────────────────────
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  msix: ^3.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/edsac_logo.png"
  min_sdk_android: 21
  web:
    generate: false
  windows:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

msix_config:
  display_name: EDASAC Vocational Skills
  publisher_display_name: Federal Polytechnic Ilaro
  identity_name: ng.edu.fpi.vocational_skills_app
  msix_version: 1.0.0.0
  logo_path: assets\images\edsac_logo.png
  capabilities: internetClient
  publisher: CN=EDASAC-FPI-Dev